# The app lives at /worms. DocumentRoot is an empty directory so nothing is
# served at "/", and the Alias gives Laravel SCRIPT_NAME=/worms/index.php,
# from which it derives its base URL for every route()/asset() call.
ServerName localhost
<VirtualHost *:80>
    DocumentRoot /var/www/empty
    Alias /worms /var/www/html/public

    <Directory /var/www/empty>
        Require all granted
    </Directory>
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Caddy terminates TLS; let PHP see the original scheme too.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
